<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Downtown Toronto 3D</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <header class="title">
    <h1>Downtown Toronto</h1>
    <p>Drag to orbit · scroll to zoom · click a landmark</p>
  </header>

  <div class="controls">
    <button id="fly" type="button">▶ Fly-through</button>
    <button id="reset" type="button">Reset view</button>
  </div>

  <div id="tooltip" hidden></div>

  <aside id="panel" hidden>
    <button id="panel-close" type="button" aria-label="Close">✕</button>
    <h2 id="panel-name"></h2>
    <p id="panel-meta"></p>
    <p id="panel-text"></p>
  </aside>

  <div id="loading">Building Toronto…</div>

  <script type="module" src="main.js"></script>
</body>
</html>
